name: HueBall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bagimliliklari yukle
        run: npm install

      - name: Android platformunu olustur
        run: npx cap add android

      - name: Ikon ve splash uret
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#12141a' \
            --splashBackgroundColor '#12141a'
          echo "--- uretilen ikonlar ---"
          find android/app/src/main/res -name "ic_launcher*" | head -20

      - name: Yatay ekran kilidini uygula
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' $MANIFEST
          grep -n "screenOrientation" $MANIFEST || (echo "HATA: yatay kilit uygulanamadi" && exit 1)

      - name: Web dosyalarini senkronize et
        run: npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: hueball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
