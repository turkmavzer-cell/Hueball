name: HueBall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bagimliliklari yukle
        run: npm install

      - name: Android platformunu olustur
        run: npx cap add android

      # ---- IKON DOSYALARINI TOPARLA ----
      # capacitor-assets gorselleri resources/ altinda arar.
      # Dosyalar depo kokunde duruyorsa buraya kopyalanir.
      - name: Ikon dosyalarini hazirla
        run: |
          mkdir -p resources
          for f in icon.png icon-foreground.png icon-background.png splash.png; do
            if [ -f "$f" ] && [ ! -f "resources/$f" ]; then
              cp "$f" resources/
              echo "kok dizinden kopyalandi: $f"
            fi
          done
          echo "--- resources/ icerigi ---"
          ls -la resources/
          if [ ! -f resources/icon.png ]; then
            echo "HATA: resources/icon.png bulunamadi"
            exit 1
          fi

      - name: Ikon ve splash uret
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#12141a' \
            --splashBackgroundColor '#12141a'
          echo "--- uretilen ikonlar ---"
          find android/app/src/main/res -name "ic_launcher*" | head -20

      # ---- YATAY EKRAN KILIDI ----
      - name: Yatay ekran kilidini uygula
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="sensorLandscape"|' $MANIFEST
          grep -n "screenOrientation" $MANIFEST || (echo "HATA: yatay kilit uygulanamadi" && exit 1)

      # ---- TAM EKRAN: durum cubugu, gezinme cubugu ve centik alani ----
      # 1) MainActivity: sistem cubuklarini gizler (immersive sticky)
      - name: Tam ekran modunu uygula
        run: |
          PKG=$(grep -oP '(?<="appId": ")[^"]+' capacitor.config.json)
          DIR="android/app/src/main/java/$(echo $PKG | tr '.' '/')"
          echo "paket: $PKG"
          echo "dizin: $DIR"
          cat > "$DIR/MainActivity.java" <<EOF
          package $PKG;

          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  View decor = getWindow().getDecorView();
                  decor.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                    | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                    | View.SYSTEM_UI_FLAG_FULLSCREEN
                    | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          EOF
          echo "--- MainActivity.java ---"
          cat "$DIR/MainActivity.java"

      # 2) Tema: centik alanini kullanilabilir yap, cubuklari seffaflastir
      #    values-v27 kullanilir; boylece eski Android surumlerinde sorun cikmaz.
      - name: Centik ve seffaf cubuk temasini ekle
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = 'android/app/src/main/res/values/styles.xml'
          dst_dir = 'android/app/src/main/res/values-v27'
          os.makedirs(dst_dir, exist_ok=True)
          xml = open(src, encoding='utf-8').read()

          extra = (
            '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>\n'
            '        <item name="android:statusBarColor">@android:color/transparent</item>\n'
            '        <item name="android:navigationBarColor">@android:color/transparent</item>\n'
            '        <item name="android:windowTranslucentStatus">false</item>\n'
            '        <item name="android:windowTranslucentNavigation">false</item>\n'
          )
          # Her <style ...> blogunun basina ek ozellikleri yerlestir
          out = re.sub(r'(<style\b[^>]*>\n)', lambda m: m.group(1) + extra, xml)
          open(os.path.join(dst_dir, 'styles.xml'), 'w', encoding='utf-8').write(out)
          print('--- values-v27/styles.xml ---')
          print(out)
          PYEOF

      - name: Web dosyalarini senkronize et
        run: npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: hueball-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
