<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HueBall</title>
<style>
  :root{--bg:#14161c;--panel:#1e2129;--panel2:#262a34;--border:#2c303a;
    --text:#e8e9ed;--muted:#9aa0ac;--accent:#6c8cff;--accent2:#ff8a5c;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px;max-width:900px;margin:0 auto;}
  h1{font-size:15px;margin:0;letter-spacing:.5px;}
  h1 .a{color:var(--accent2);} h1 .b{color:var(--accent);}

  #viewport{width:100%;position:relative;aspect-ratio:16/9;overflow:hidden;
    border-radius:14px;border:1px solid var(--border);background:#0c0d11;}
  #viewport .panel,#viewport #stage-wrap{position:absolute;inset:0;border:none;border-radius:0;}
  #stage-wrap{background:#0c0d11;touch-action:none;user-select:none;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}

  /* Dokunma: TÜM EKRAN — sol yarı / sağ yarı (HUD şeridinin altından başlar) */
  .half{position:absolute;top:7.4%;bottom:0;width:50%;z-index:2;
    display:flex;align-items:center;opacity:0;transition:opacity .12s;}
  .half.active{opacity:1;}
  .half-l{left:0;justify-content:flex-start;padding-left:3%;
    background:linear-gradient(90deg,rgba(108,140,255,.20),transparent 60%);}
  .half-r{right:0;justify-content:flex-end;padding-right:3%;
    background:linear-gradient(270deg,rgba(108,140,255,.20),transparent 60%);}
  .half span{font-size:clamp(16px,4vw,34px);color:var(--accent);text-shadow:0 0 14px rgba(108,140,255,.6);}

  #hud{position:absolute;top:0;left:0;right:0;height:7.4%;z-index:5;
    display:flex;align-items:center;gap:4px;padding:0 5px;
    background:linear-gradient(180deg,rgba(12,13,17,.94),rgba(12,13,17,0));}
  .chip{display:flex;align-items:center;gap:4px;background:rgba(38,42,52,.85);
    border:1px solid var(--border);padding:2px 7px;border-radius:999px;
    font-size:clamp(7.5px,1.5vw,12px);color:var(--muted);white-space:nowrap;}
  .chip b{color:var(--text);}
  #ballSwatch{width:9px;height:9px;border-radius:50%;display:inline-block;transition:background .18s linear;}
  #hud .hbtn{background:rgba(38,42,52,.9);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:2px 8px;font-size:clamp(7.5px,1.5vw,12px);font-weight:600;}
  #hud .spacer{flex:1;}

  #overlay{position:absolute;inset:0;background:rgba(10,11,14,.94);display:none;z-index:10;
    align-items:center;justify-content:center;flex-direction:column;gap:2.5%;text-align:center;padding:10px;}
  #overlay.show{display:flex;}
  #overlay h2{margin:0;font-size:clamp(13px,3.4vw,24px);}
  #overlay p{margin:0;font-size:clamp(8.5px,1.9vw,13px);color:var(--muted);
    white-space:pre-line;line-height:1.5;}

  button{font-family:inherit;cursor:pointer;}
  .btn{background:var(--accent);border:none;color:#10121a;font-weight:700;
    padding:clamp(5px,1.4vw,11px) clamp(12px,3vw,24px);border-radius:9px;font-size:clamp(10px,2vw,15px);}
  .btn.sec{background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:600;}
  .btn.sm{padding:4px 11px;font-size:clamp(9px,1.7vw,12.5px);}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
  #ovBtns{flex-direction:column;align-items:center;gap:3.5%;flex-wrap:nowrap;width:100%;}
  .ov-row{display:flex;gap:3%;justify-content:center;width:100%;}
  #ovBtns .btn.hero{min-width:52%;background:linear-gradient(135deg,#8aa2ff,#5b7bff);
    box-shadow:0 4px 18px rgba(108,140,255,.42);font-size:clamp(11px,2.5vw,18px);letter-spacing:.3px;
    padding:clamp(6px,1.8vw,13px) clamp(18px,4.5vw,32px);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
  .ov-row{margin-top:2.5%;}
  .ov-row .btn{background:var(--panel2);border:1px solid #3a4050;color:var(--text);
    font-weight:600;font-size:clamp(9px,1.9vw,14px);border-radius:10px;
    padding:clamp(5px,1.5vw,11px) clamp(10px,2.6vw,20px);
    min-width:30%;display:flex;align-items:center;justify-content:center;gap:5px;}
  .ov-row .btn .ico{font-size:1.1em;line-height:1;opacity:.8;}

  .panel{display:none;background:var(--panel);padding:2.2% 3.5%;flex-direction:column;
    gap:2.2%;align-items:center;text-align:center;overflow-y:auto;}
  .panel.show{display:flex;}
  #panelMenu{flex-direction:row;align-items:center;text-align:left;gap:3%;}
  .menu-left{flex:0 0 36%;display:flex;flex-direction:column;align-items:stretch;gap:3%;min-width:0;}
  .menu-right{flex:1;display:flex;flex-direction:column;gap:3%;min-width:0;}
  #logo{font-size:clamp(20px,5.4vw,42px);font-weight:800;letter-spacing:1px;line-height:1;}
  #logo .a{color:var(--accent2);} #logo .b{color:var(--accent);}
  .tag{font-size:clamp(8px,1.6vw,13px);color:var(--muted);}
  .menu-left .btn{width:100%;text-align:center;}
  .panel h3{margin:0;font-size:clamp(11px,2.2vw,16px);font-weight:700;}

  #legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;width:100%;
    background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:7px 9px;}
  #legend .row{display:flex;align-items:center;gap:6px;font-size:clamp(6.5px,1.35vw,12px);
    color:var(--muted);text-align:left;line-height:1.2;}
  #legend svg{flex:none;}
  .hint{font-size:clamp(7px,1.4vw,12px);color:var(--muted);line-height:1.45;}

  /* Sekmeler */
  .tabs{display:flex;gap:5px;justify-content:center;}
  .tabs button{background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:4px 12px;border-radius:999px;font-size:clamp(8px,1.6vw,12.5px);font-weight:600;}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#10121a;}

  #levelGrid,#customGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));
    gap:5px;width:100%;}
  .lvl{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:5px 3px;
    display:flex;flex-direction:column;gap:1px;align-items:center;color:var(--text);min-width:0;}
  .lvl .n{font-size:clamp(11px,2.2vw,18px);font-weight:800;color:var(--accent);}
  .lvl .d{font-size:clamp(6px,1.1vw,9px);color:var(--muted);line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .lvl.add{border-style:dashed;border-color:var(--accent);}
  /* Kayıtlı bölüm eylem penceresi */
  #custAct{position:absolute;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;background:rgba(8,9,12,.9);padding:12px;}
  #custAct.show{display:flex;}
  .cabox{background:var(--panel);border:1px solid #3a4050;border-radius:14px;
    padding:3% 4%;max-width:78%;text-align:center;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.55);}
  .cabox h4{margin:0;font-size:clamp(10px,2.2vw,16px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #caBtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;}
  #caBtns .btn{padding:5px 12px;font-size:clamp(8px,1.7vw,13px);}
  .btn.dngr{background:#b3382c;color:#fff;border:none;}
  .lvl.add .n{color:var(--accent2);}
  .empty-note{font-size:clamp(8px,1.6vw,12px);color:var(--muted);padding:8px;}

  #setGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;}
  .setting{display:flex;flex-direction:column;gap:4px;text-align:left;
    background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:6px 9px;}
  .setting .lbl{font-size:clamp(7.5px,1.5vw,12.5px);font-weight:600;
    display:flex;justify-content:space-between;align-items:center;gap:5px;}
  .setting .lbl small{font-weight:400;color:var(--muted);font-size:clamp(6.5px,1.2vw,10.5px);}
  .seg{display:flex;gap:4px;}
  .seg button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:4px 2px;border-radius:6px;font-size:clamp(7px,1.4vw,11.5px);}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#10121a;font-weight:700;}

  /* ---------- EDİTÖR ---------- */
  /* ---------- EDİTÖR (16:9 ızgara odaklı) ---------- */
  #panelEditor{flex-direction:row;align-items:stretch;gap:1.6%;padding:1.4% 2%;
    overflow:hidden;touch-action:none;text-align:left;}

  /* Sol: ızgara + altındaki eylem şeridi */
  #edMain{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;overflow:hidden;}
  #edCanvasWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    gap:4px;position:relative;}
  #edCanvas{background:#12141a;border:1px solid var(--border);border-radius:8px;
    height:100%;width:auto;max-width:calc(100% - clamp(22px,3.6vw,32px));
    aspect-ratio:16/9;touch-action:none;display:block;}
  .edScrollCol{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
    align-self:stretch;flex:none;z-index:4;width:clamp(20px,3.2vw,28px);}
  .edScrollCol button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);
    border-radius:6px;width:clamp(16px,2.8vw,24px);height:clamp(16px,2.8vw,24px);
    font-size:clamp(8px,1.5vw,12px);line-height:1;padding:0;}
  .edScrollCol button:disabled{opacity:.3;}
  #edBottom{display:flex;align-items:center;gap:4px;flex:none;flex-wrap:nowrap;}
  #edBottom .btn{flex:none;white-space:nowrap;}
  /* Mesaj: ızgaranın üstünde açılan, tam okunur panel */
  #edMsg{display:none;position:absolute;left:0;right:0;bottom:0;z-index:8;
    background:rgba(18,20,26,.97);border:1px solid var(--border);border-radius:8px;
    padding:6px 24px 6px 9px;font-size:clamp(6.5px,1.3vw,11px);line-height:1.4;
    color:var(--muted);white-space:pre-line;max-height:62%;overflow-y:auto;
    box-shadow:0 -4px 16px rgba(0,0,0,.5);cursor:pointer;}
  #edMsg.show{display:block;}
  #edMsg.ok{color:#8CE8B0;border-color:#2b5c40;}
  #edMsg.warn{color:#ffd08a;border-color:#5c4a2b;}
  #edMsg::after{content:'✕';position:absolute;top:4px;right:7px;
    color:var(--muted);font-size:1.1em;line-height:1;}

  /* Sağ: nesne paleti */
  #edSide{flex:0 0 26%;display:flex;flex-direction:column;gap:4px;min-width:0;
    overflow-y:auto;overflow-x:hidden;}
  .edTitle{font-size:clamp(6px,1.2vw,10px);font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px;flex:none;}
  .edPal{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:none;}
  .edPal button{background:var(--panel2);border:1px solid var(--border);
    border-radius:7px;padding:3px;aspect-ratio:1;min-width:0;
    display:flex;align-items:center;justify-content:center;}
  .edPal button svg{width:100%;height:100%;display:block;}
  .edPal button.on{background:rgba(108,140,255,.28);border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;}
  .edCols{display:flex;gap:3px;flex:none;}
  .edCols button{flex:1;height:clamp(15px,3vw,24px);border-radius:5px;border:2px solid transparent;}
  .edCols button.on{border-color:#fff;}
  #edSide .seg{flex:none;}
  #edSide .seg button{padding:3px 1px;font-size:clamp(6px,1.2vw,10px);}
  #edSideBtns{display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:none;padding-top:2px;}
  #edSideBtns .btn{padding:4px 2px;font-size:clamp(6px,1.2vw,10px);}
  #edRowLabel{font-size:clamp(6px,1.2vw,10px);color:var(--text);flex:none;white-space:nowrap;
    background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    padding:2px 7px;z-index:4;min-width:0;}
  #edRowLabel:empty{display:none;}
  #edBack2{flex:none;font-weight:700;padding:4px 9px;
    background:var(--panel2);border:1px solid #4a5266;color:var(--text);}
  #edBack2:active{background:#323847;}

  #howto{width:100%;font-size:11px;color:var(--muted);line-height:1.5;}

  .lvl.add{cursor:pointer;}


  @media (orientation:landscape) and (max-height:640px){
    #app{padding:0;gap:0;max-width:none;width:100vw;height:100vh;}
    h1,#howto{display:none !important;}
    #viewport{height:100vh;width:100vw;aspect-ratio:auto;border:none;border-radius:0;}
  }
</style>
</head>
<body>
<div id="app">
  <h1><span class="a">Hue</span><span class="b">Ball</span></h1>

  <div id="viewport">

    <!-- ANA MENÜ -->
    <div class="panel show" id="panelMenu">
      <div class="menu-left">
        <div id="logo"><span class="a">Hue</span><span class="b">Ball</span></div>
        <div class="tag" data-i18n="tagline"></div>
        <button class="btn" id="btnPlay"></button>
        <button class="btn sec" id="btnLevels" data-i18n="levels"></button>
        <button class="btn sec" id="btnSettings" data-i18n="settings"></button>
      </div>
      <div class="menu-right">
        <div id="legend">
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="4" fill="#E63946"/></svg><span data-i18n="lg_block"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="4" fill="#3a3f4a" stroke="#3A86FF" stroke-width="2.5"/><circle cx="10" cy="10" r="3.4" fill="#3A86FF"/></svg><span data-i18n="lg_changer"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="4" fill="#7a2a30" stroke="#E63946" stroke-width="2"/><path d="M5 5 L10 10 L6 14 M14 5 L11 11 L15 15" stroke="#2a1418" stroke-width="1.8" fill="none"/></svg><span data-i18n="lg_crack"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="3" fill="none" stroke="#2ECC71" stroke-width="2" stroke-dasharray="3 2"/><rect x="6" y="6" width="8" height="8" rx="1.5" fill="#2ECC71" opacity=".35"/></svg><span data-i18n="lg_gate"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1.5" y="1.5" width="17" height="17" rx="2" fill="#8b93a1" stroke="#2f3540" stroke-width="1.6"/><path d="M10 4.5 v11 M4.5 10 h11 M10 4.5 l-2 2.2 M10 4.5 l2 2.2 M10 15.5 l-2 -2.2 M10 15.5 l2 -2.2 M4.5 10 l2.2 -2 M4.5 10 l2.2 2 M15.5 10 l-2.2 -2 M15.5 10 l-2.2 2" stroke="#2f3540" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg><span data-i18n="lg_push"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1.5" y="1.5" width="17" height="17" rx="2" fill="#6b7280" stroke="#2f3540" stroke-width="1.6"/><path d="M4 10 h12 M4 10 l3 -3 M4 10 l3 3 M16 10 l-3 -3 M16 10 l-3 3" stroke="#e8e9ed" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span data-i18n="lg_mover"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#b06cff" stroke-width="1" opacity=".5"/><rect x="4.5" y="4.5" width="11" height="11" rx="3" fill="#2b2338" stroke="#b06cff" stroke-width="2"/><circle cx="10" cy="10" r="2.4" fill="#b06cff"/></svg><span data-i18n="lg_magnet"></span></div>
          <div class="row"><svg width="15" height="15" viewBox="0 0 20 20"><rect x="1" y="1" width="18" height="18" rx="4" fill="#2a1418" stroke="#c0392b" stroke-width="2.5"/><line x1="6" y1="6" x2="14" y2="14" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/><line x1="14" y1="6" x2="6" y2="14" stroke="#e74c3c" stroke-width="2.5" stroke-linecap="round"/></svg><span data-i18n="lg_trap"></span></div>
        </div>
        <div class="hint" data-i18n="menu_hint"></div>
      </div>
    </div>

    <!-- BÖLÜMLER -->
    <div class="panel" id="panelLevels">
      <div class="tabs">
        <button id="tabBuilt" class="on" data-i18n="tab_built"></button>
        <button id="tabMine" data-i18n="tab_mine"></button>
      </div>
      <div id="levelGrid"></div>
      <div id="mineWrap" style="display:none;width:100%;flex-direction:column;gap:6px;">
        <div id="customGrid"></div>
        <div class="empty-note" id="customEmpty" data-i18n="no_custom"></div>
        <div class="btn-row">
          <button class="btn sm" id="btnNewLevel" data-i18n="new_level"></button>
          <button class="btn sec sm" id="btnUpload" data-i18n="upload_file"></button>
        </div>
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none">
      <button class="btn sec sm" data-back data-i18n="back_menu"></button>
    </div>

    <!-- EDİTÖR -->
    <div class="panel" id="panelEditor">

      <!-- Sol: 16:9 ızgara + eylem şeridi -->
      <div id="edMain">
        <div id="edCanvasWrap">
          <canvas id="edCanvas" width="640" height="360"></canvas>
          <div class="edScrollCol">
            <button id="edUp">▲</button>
            <button id="edDown">▼</button>
          </div>
          <div id="edMsg"></div>
        </div>
        <div id="edBottom">
          <button class="btn sec sm" id="edBack2" title="Bölümler">←</button>
          <button class="btn sm" id="edTest" data-i18n="ed_test"></button>
          <button class="btn sec sm" id="edCheck" data-i18n="ed_check"></button>
          <button class="btn sec sm" id="edShare" data-i18n="ed_share"></button>
          <button class="btn sec sm" id="edUndo" data-i18n="ed_undo"></button>
          <span id="edRowLabel"></span>
        </div>
      </div>

      <!-- Sağ: nesne paleti -->
      <div id="edSide">
        <div class="edTitle" data-i18n="ed_type"></div>
        <div class="edPal" id="edTypes"></div>
        <div class="edTitle" data-i18n="ed_color"></div>
        <div class="edCols" id="edColors"></div>
        <div class="edTitle" data-i18n="ed_start"></div>
        <div class="edCols" id="edStart"></div>
        <div class="edTitle" data-i18n="ed_rows"></div>
        <div class="seg" data-edset="rows">
          <button data-v="9">9</button><button data-v="12">12</button>
          <button data-v="18">18</button><button data-v="24">24</button>
        </div>
        <div id="edSideBtns">
          <button class="btn sec sm" id="edSave" data-i18n="ed_save"></button>
          <button class="btn sec sm" id="edClear" data-i18n="ed_clear"></button>
          <button class="btn sec sm" id="edBack" data-i18n="back_levels" style="grid-column:1/-1"></button>
        </div>
      </div>

    </div>

    <!-- AYARLAR -->
    <div class="panel" id="panelSettings">
      <h3 data-i18n="settings"></h3>
      <div id="setGrid">
        <div class="setting"><div class="lbl"><span data-i18n="s_speed"></span> <small id="vSpeed"></small></div>
          <div class="seg" data-set="speed"><button data-v="slow" data-i18n="o_slow"></button><button data-v="normal" data-i18n="o_normal"></button><button data-v="fast" data-i18n="o_fast"></button></div></div>
        <div class="setting"><div class="lbl"><span data-i18n="s_steer"></span> <small id="vSteer"></small></div>
          <div class="seg" data-set="steer"><button data-v="low" data-i18n="o_low"></button><button data-v="mid" data-i18n="o_mid"></button><button data-v="high" data-i18n="o_high"></button></div></div>
        <div class="setting"><div class="lbl"><span data-i18n="s_zoom"></span></div>
          <div class="seg" data-set="zoom"><button data-v="far" data-i18n="o_far"></button><button data-v="near" data-i18n="o_near"></button></div></div>
        <div class="setting"><div class="lbl"><span data-i18n="s_lang"></span></div>
          <div class="seg" data-set="lang"><button data-v="tr">Türkçe</button><button data-v="en">English</button></div></div>
        <div class="setting"><div class="lbl"><span data-i18n="s_sound"></span></div>

  nTr,nEn,dTr,dEn,start, rows:rows.slice(), custom:false
}));

/* =========================================================
   4. GEOMETRİ — tahta TÜM EKRANI kaplar, kenarlar oyun alanının parçası
   ========================================================= */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
let W=960,H=540,TOPBAR,VISROWS=9,PAD=0,COLS=9;
let boardW,boardH,cell,boardX,boardY,R,U=1;

function layout(){
  const box=document.getElementById('viewport');
  const bw=(box&&box.clientWidth)||960, bh=(box&&box.clientHeight)||540;
  const ar=Math.max(1.15,Math.min(2.60,bw/bh));
  const oldCell=cell;
  H=540; W=Math.round(H*ar);
  canvas.width=W; canvas.height=H;
  TOPBAR=H*0.074;
  const availH=H-TOPBAR-8;
  if(settings.zoom==='near'){
    VISROWS=9;
    for(let vr=9; vr>=5; vr--){                      // kenar payı ≤3 sütun olacak şekilde yakınlaş
      const c=availH/vr;
      if((Math.floor(W/c)-SRC_COLS)/2 <= 3.2){ VISROWS=vr; break; }
    }
  } else VISROWS=9;
  cell=availH/VISROWS;
  PAD=Math.max(0,Math.min(2,Math.floor((W/cell-SRC_COLS)/2)));  // en fazla 2 sütun kenar payı
  COLS=SRC_COLS+PAD*2;
  boardW=COLS*cell; boardH=VISROWS*cell;
  boardX=(W-boardW)/2; boardY=TOPBAR+(H-TOPBAR-boardH)/2;
  R=cell*0.32; U=cell/BASECELL;
  if(oldCell && ball){ const k=cell/oldCell; ball.x*=k; ball.y*=k; scrollY*=k; worldH=ROWS*cell; }
}
const spd  = () => SPEEDS[settings.speed]*U;
const strA = () => STEERS[settings.steer].a*U;
const strM = () => STEERS[settings.steer].m*U;

/* =========================================================
   5. AYARLAR & KAYIT
   ========================================================= */
const settings = {speed:'normal',steer:'mid',zoom:'far',sound:'on',
                  vibrate:'on',cb:'off',grid:'on',lefty:'off',lang:''};
let progress = {reached:1, best:{}, custom:[]};
const SPD_F = {slow:SPEEDS.slow/SPEEDS.fast, normal:SPEEDS.normal/SPEEDS.fast, fast:1};
let levelTime=0, levelScore=0;
function timeFactor(){ return Math.max(0.20, 1 - levelTime/100); }
function blockValue(){ return Math.max(1, Math.round(100*SPD_F[settings.speed]*timeFactor())); }
function totalScore(){ let n=0; for(const k in progress.best) n+=progress.best[k]; return n; }
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(_){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }
};
function loadSave(){
  const s=store.get('hueball.settings4',null); if(s) Object.assign(settings,s);
  const p=store.get('hueball.progress4',null); if(p&&p.reached) progress=p;
  if(!progress.best) progress.best={};
  if(!progress.custom) progress.custom=[];
  if(!settings.lang) settings.lang=detectLang();
  lang=settings.lang;
}
function saveAll(){ store.set('hueball.settings4',settings); store.set('hueball.progress4',progress); }

/* =========================================================
   6. DURUM
   ========================================================= */
let grid, ROWS, worldH, scrollY, ball, dx, dy, steer, state, levelIdx, curLevel=null;
let ballColor='red', prevColor='red', colorT=1;      // yumuşak renk geçişi
let movers=[], tGlobal=0;
const cellRect = (r,c) => ({x:c*cell, y:r*cell, w:cell, h:cell});
function shade(which){                                // topun o anki karışık rengi
  if(colorT>=1) return COLORS[ballColor][which];
  return mixHex(COLORS[prevColor][which], COLORS[ballColor][which], colorT);
}
function setBallColor(c){
  if(c===ballColor) return;
  prevColor = colorT>=1 ? ballColor : ballColor;
  ballColor = c; colorT = 0;
}

/* =========================================================
   7. SES / TİTREŞİM
   ========================================================= */
let actx=null;
function beep(f,d,ty){
  if(settings.sound!=='on') return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=ty||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(.06,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(_){}
}
function buzz(p){ if(settings.vibrate==='on'&&navigator.vibrate){try{navigator.vibrate(p);}catch(_){}} }

/* =========================================================
   8. PARÇACIK / SARSINTI / BİLDİRİM / İTME ANİMASYONU
   ========================================================= */
let parts=[], shake=0, deathT=0, deathCell=null, toast=null, pushAnims=[];
const PUSH_DUR=12;
function burst(wx,wy,color,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=sp*U*(0.35+Math.random()*0.65);
    parts.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2*U,
      life:1,dec:0.013+Math.random()*0.016,c:color,s:(1.4+Math.random()*2.6)*U});
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.13*U*dt; p.vx*=0.99; p.life-=p.dec*dt;
    if(p.life<=0) parts.splice(i,1); }
}
function updatePushAnims(dt){
  for(let i=pushAnims.length-1;i>=0;i--){ pushAnims[i].t+=dt;
    if(pushAnims[i].t>=PUSH_DUR) pushAnims.splice(i,1); }
}
function pushOffset(r,c){
  for(const a of pushAnims) if(a.r===r&&a.c===c){
    const x=Math.min(1,a.t/PUSH_DUR), e=1-Math.pow(1-x,3);
    return {x:-a.dc*cell*(1-e), y:-a.dr*cell*(1-e), s:1+0.10*(1-e)};
  }
  return null;
}
function moverVis(r,c){ for(const m of movers) if(m.r===r&&m.c===c) return m.vis||0; return 0; }

/* =========================================================
   9. ÇİZİM
   ========================================================= */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function sym(cx,cy,s,k,col){
  ctx.fillStyle=col||'rgba(255,255,255,.85)'; ctx.beginPath();
  if(k==='circle') ctx.arc(cx,cy,s*.5,0,Math.PI*2);
  else if(k==='triangle'){ctx.moveTo(cx,cy-s*.55);ctx.lineTo(cx+s*.55,cy+s*.45);ctx.lineTo(cx-s*.55,cy+s*.45);}
  else if(k==='square') ctx.rect(cx-s*.45,cy-s*.45,s*.9,s*.9);
  else {ctx.moveTo(cx,cy-s*.6);ctx.lineTo(cx+s*.55,cy);ctx.lineTo(cx,cy+s*.6);ctx.lineTo(cx-s*.55,cy);}
  ctx.closePath(); ctx.fill();
}
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1d24'); g.addColorStop(1,'#0f1116');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(settings.grid==='on'){
    ctx.save(); ctx.beginPath(); ctx.rect(boardX,boardY,boardW,boardH); ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,.035)'; ctx.lineWidth=1;
    for(let i=0;i<=COLS;i++){ const x=boardX+i*cell;
      ctx.beginPath(); ctx.moveTo(x,boardY); ctx.lineTo(x,boardY+boardH); ctx.stroke(); }
    const first=Math.floor(scrollY/cell);
    for(let r=first;r<=first+VISROWS+1;r++){ const y=boardY+r*cell-scrollY;
      ctx.beginPath(); ctx.moveTo(boardX,y); ctx.lineTo(boardX+boardW,y); ctx.stroke(); }
    ctx.restore();
  }
  // içerik sütunlarını hafifçe belirginleştir (kenar payı oyun alanının parçası ama daha sönük)
  ctx.fillStyle='rgba(255,255,255,.018)';
  ctx.fillRect(boardX+PAD*cell, boardY, SRC_COLS*cell, boardH);
}
function dBlock(x,y,w,h,key,cracked){
  const c=COLORS[key], p=3*U;
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  if(cracked){ g.addColorStop(0,c.base); g.addColorStop(.5,c.dark); g.addColorStop(1,'#3a2a2e'); }
  else { g.addColorStop(0,c.light); g.addColorStop(.5,c.base); g.addColorStop(1,c.dark); }
  ctx.fillStyle=g; rr(x+p,y+p,w-p*2,h-p*2,8*U); ctx.fill();
  ctx.strokeStyle=c.dark; ctx.lineWidth=2*U; rr(x+p,y+p,w-p*2,h-p*2,8*U); ctx.stroke();
  if(cracked){
    ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=2*U; ctx.lineCap='round'; ctx.beginPath();
    ctx.moveTo(x+w*.2,y+h*.18); ctx.lineTo(x+w*.46,y+h*.5); ctx.lineTo(x+w*.28,y+h*.82);
    ctx.moveTo(x+w*.78,y+h*.2); ctx.lineTo(x+w*.55,y+h*.55); ctx.lineTo(x+w*.8,y+h*.84);
    ctx.stroke();
  } else {
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath();
    ctx.moveTo(x+p+4*U,y+p+4*U); ctx.lineTo(x+w-p-4*U,y+p+4*U); ctx.lineTo(x+w*.55,y+h*.4);
    ctx.closePath(); ctx.fill();
  }
  if(settings.cb==='on') sym(x+w/2,y+h/2,w*.28,c.sym);
}
function dChanger(x,y,w,h,key){
  const c=COLORS[key], p=5*U;
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#3a3f4a'); g.addColorStop(1,'#20232b');
  ctx.fillStyle=g; rr(x+p,y+p,w-p*2,h-p*2,10*U); ctx.fill();
  ctx.strokeStyle=c.base; ctx.lineWidth=3*U; rr(x+p,y+p,w-p*2,h-p*2,10*U); ctx.stroke();
  const cx=x+w/2, cy=y+h/2, r=Math.min(w,h)*.22;
  ctx.strokeStyle=c.base; ctx.lineWidth=3*U; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI*.15,Math.PI*1.35); ctx.stroke();
  const a=Math.PI*1.35, ax=cx+Math.cos(a)*r, ay=cy+Math.sin(a)*r;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax-6*U,ay-2*U);
  ctx.moveTo(ax,ay); ctx.lineTo(ax-2*U,ay+6*U); ctx.stroke();
  ctx.fillStyle=c.base; ctx.beginPath(); ctx.arc(cx,cy,r*.42,0,Math.PI*2); ctx.fill();
}
function dGate(x,y,w,h,key,open){
  const c=COLORS[key], p=4*U;
  ctx.save(); ctx.globalAlpha=open?.3:1;
  ctx.fillStyle=open?'rgba(255,255,255,.04)':'rgba(20,23,29,.9)';
  rr(x+p,y+p,w-p*2,h-p*2,6*U); ctx.fill();
  ctx.strokeStyle=c.base; ctx.lineWidth=2.5*U; ctx.setLineDash([6*U,4*U]);
  rr(x+p,y+p,w-p*2,h-p*2,6*U); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle=c.base; ctx.globalAlpha=open?.18:.38;
  rr(x+w*.3,y+h*.3,w*.4,h*.4,4*U); ctx.fill(); ctx.restore();
  if(settings.cb==='on'){ ctx.save(); ctx.globalAlpha=open?.4:1; sym(x+w/2,y+h/2,w*.2,c.sym); ctx.restore(); }
}
function dTrap(x,y,w,h){
  const p=4*U;
  ctx.fillStyle='#2a1418'; rr(x+p,y+p,w-p*2,h-p*2,8*U); ctx.fill();
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=2.5*U; rr(x+p,y+p,w-p*2,h-p*2,8*U); ctx.stroke();
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=4*U; ctx.lineCap='round';
  const m=w*.28; ctx.beginPath();
  ctx.moveTo(x+m,y+m); ctx.lineTo(x+w-m,y+h-m);
  ctx.moveTo(x+w-m,y+m); ctx.lineTo(x+m,y+h-m); ctx.stroke();
}
function dWall(x,y,w,h){
  const p=2*U, g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#8b93a1'); g.addColorStop(1,'#4b5563');
  ctx.fillStyle=g; ctx.fillRect(x+p,y+p,w-p*2,h-p*2);
  ctx.strokeStyle='#2f3540'; ctx.lineWidth=2*U; ctx.strokeRect(x+p,y+p,w-p*2,h-p*2);
  ctx.fillStyle='rgba(255,255,255,.2)';
  [[.22,.22],[.78,.22],[.22,.78],[.78,.78]].forEach(([a,b])=>{
    ctx.beginPath(); ctx.arc(x+w*a,y+h*b,2.2*U,0,Math.PI*2); ctx.fill(); });
}
function dPush(x,y,w,h){
  const p=3*U, g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#a9b2c0'); g.addColorStop(1,'#5b6472');
  ctx.fillStyle=g; rr(x+p,y+p,w-p*2,h-p*2,5*U); ctx.fill();
  ctx.strokeStyle='#343a45'; ctx.lineWidth=2*U; rr(x+p,y+p,w-p*2,h-p*2,5*U); ctx.stroke();
  const cx=x+w/2, cy=y+h/2, a=w*.26, k=w*.075;
  ctx.strokeStyle='rgba(38,43,53,.95)'; ctx.lineWidth=2.2*U; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(cx-a,cy); ctx.lineTo(cx+a,cy); ctx.moveTo(cx,cy-a); ctx.lineTo(cx,cy+a);
  ctx.moveTo(cx-a,cy); ctx.lineTo(cx-a+k,cy-k); ctx.moveTo(cx-a,cy); ctx.lineTo(cx-a+k,cy+k);
  ctx.moveTo(cx+a,cy); ctx.lineTo(cx+a-k,cy-k); ctx.moveTo(cx+a,cy); ctx.lineTo(cx+a-k,cy+k);
  ctx.moveTo(cx,cy-a); ctx.lineTo(cx-k,cy-a+k); ctx.moveTo(cx,cy-a); ctx.lineTo(cx+k,cy-a+k);
  ctx.moveTo(cx,cy+a); ctx.lineTo(cx-k,cy+a-k); ctx.moveTo(cx,cy+a); ctx.lineTo(cx+k,cy+a-k);
  ctx.stroke();
}
function dMover(x,y,w,h){
  const p=2*U, g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#7c8698'); g.addColorStop(1,'#3f4653');
  ctx.fillStyle=g; rr(x+p,y+p,w-p*2,h-p*2,4*U); ctx.fill();
  ctx.strokeStyle='#262b34'; ctx.lineWidth=2*U; rr(x+p,y+p,w-p*2,h-p*2,4*U); ctx.stroke();
  ctx.strokeStyle='rgba(232,233,237,.85)'; ctx.lineWidth=2*U; ctx.lineCap='round';
  const cx=x+w/2, cy=y+h/2, a=w*.28, k=w*.09;
  ctx.beginPath();
  ctx.moveTo(cx-a,cy); ctx.lineTo(cx+a,cy);
  ctx.moveTo(cx-a,cy); ctx.lineTo(cx-a+k,cy-k); ctx.moveTo(cx-a,cy); ctx.lineTo(cx-a+k,cy+k);
  ctx.moveTo(cx+a,cy); ctx.lineTo(cx+a-k,cy-k); ctx.moveTo(cx+a,cy); ctx.lineTo(cx+a-k,cy+k);
  ctx.stroke();
}
function dMagnet(x,y,w,h){
  const cx=x+w/2, cy=y+h/2, pulse=0.5+0.5*Math.sin(tGlobal*0.05);
  ctx.save();
  for(let i=1;i<=3;i++){
    ctx.globalAlpha=(0.13+0.09*pulse)/i; ctx.strokeStyle='#b06cff'; ctx.lineWidth=1.6*U;
    ctx.beginPath(); ctx.arc(cx,cy,(w*.55)*i*(0.85+0.15*pulse),0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
  const p=5*U, g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'#3b2f52'); g.addColorStop(1,'#241d33');
  ctx.fillStyle=g; rr(x+p,y+p,w-p*2,h-p*2,9*U); ctx.fill();
  ctx.strokeStyle='#b06cff'; ctx.lineWidth=3*U; rr(x+p,y+p,w-p*2,h-p*2,9*U); ctx.stroke();
  ctx.strokeStyle='#d5b3ff'; ctx.lineWidth=w*.11; ctx.lineCap='butt';
  ctx.beginPath(); ctx.arc(cx,cy+h*.04,w*.16,Math.PI,0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-w*.16,cy+h*.04); ctx.lineTo(cx-w*.16,cy+h*.16);
  ctx.moveTo(cx+w*.16,cy+h*.04); ctx.lineTo(cx+w*.16,cy+h*.16); ctx.stroke();
}
function dBall(){
  const sx=boardX+ball.x, sy=boardY+ball.y-scrollY;
  const g=ctx.createRadialGradient(sx-R*.35,sy-R*.4,R*.1,sx,sy,R);
  g.addColorStop(0,'#fff'); g.addColorStop(.4,shade('light')); g.addColorStop(1,shade('dark'));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=shade('dark'); ctx.lineWidth=1.5*U; ctx.stroke();
  if(colorT<1){                                   // geçiş halkası
    ctx.save(); ctx.globalAlpha=(1-colorT)*0.55;
    ctx.strokeStyle=COLORS[ballColor].light; ctx.lineWidth=2.5*U;
    ctx.beginPath(); ctx.arc(sx,sy,R+ (1-colorT)*R*1.1, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }
  if(settings.cb==='on') sym(sx,sy,R*.9,COLORS[ballColor].sym);
}
function drawParts(){
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(boardX+p.x, boardY+p.y-scrollY, p.s, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawToast(){
  if(!toast) return;
  ctx.save(); ctx.globalAlpha=Math.min(1,toast.life*2);
  ctx.font='600 '+(cell*0.30)+'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const tx=W/2, ty=boardY+boardH*0.14;
  const wd=ctx.measureText(toast.text).width+cell*0.5;
  ctx.fillStyle='rgba(12,13,17,.82)'; rr(tx-wd/2,ty-cell*0.26,wd,cell*0.52,cell*0.26); ctx.fill();
  ctx.fillStyle='#e8e9ed'; ctx.fillText(toast.text,tx,ty); ctx.restore();
}
function dScrollBar(){
  if(worldH<=boardH) return;
  const x=W-6*U, h=boardH;
  ctx.fillStyle='rgba(255,255,255,.07)'; rr(x,boardY,3*U,h,2); ctx.fill();
  const th=Math.max(18,h*(boardH/worldH)), ty=boardY+(h-th)*(scrollY/(worldH-boardH));
  ctx.fillStyle='rgba(108,140,255,.6)'; rr(x,ty,3*U,th,2); ctx.fill();
}
function draw(){
  ctx.save();
  if(shake>0.002){ const m=shake*9*U; ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m); }
  drawBg();
  ctx.save();
  ctx.beginPath(); ctx.rect(boardX,boardY,boardW,boardH); ctx.clip();
  const r0=Math.max(0,Math.floor(scrollY/cell)-1);
  const r1=Math.min(ROWS-1,Math.ceil((scrollY+boardH)/cell)+1);
  for(let r=r0;r<=r1;r++) for(let c=0;c<COLS;c++){
    const v=grid[r][c]; if(!v) continue;
    const q=cellRect(r,c); let x=boardX+q.x, y=boardY+q.y-scrollY;
    if(v===5) x+=moverVis(r,c);
    if(v===8){ const po=pushOffset(r,c);
      if(po){ const gg=cell*(po.s-1)/2; dPush(x+po.x-gg,y+po.y-gg,cell*po.s,cell*po.s); continue; } }
    if(isBlock(v))        dBlock(x,y,cell,cell,colBlock(v),false);
    else if(isCrack(v))   dBlock(x,y,cell,cell,colBlock(v),true);
    else if(v===5)        dMover(x,y,cell,cell);
    else if(v===6)        dTrap(x,y,cell,cell);
    else if(v===7)        dWall(x,y,cell,cell);
    else if(v===8)        dPush(x,y,cell,cell);
    else if(v===9)        dMagnet(x,y,cell,cell);
    else if(isChanger(v)) dChanger(x,y,cell,cell,colChg(v));
    else if(isGate(v))    dGate(x,y,cell,cell,colGate(v), colGate(v)===ballColor);
  }
  if(deathCell && state==='dying'){
    const q=cellRect(deathCell.r,deathCell.c);
    ctx.globalAlpha=Math.max(0,1-deathT/45)*0.75; ctx.fillStyle='#e74c3c';
    rr(boardX+q.x, boardY+q.y-scrollY, cell, cell, 8*U); ctx.fill(); ctx.globalAlpha=1;
  }
  if(state!=='dying') dBall();
  drawParts();
  ctx.restore();
  drawToast(); dScrollBar();
  ctx.restore();
}

/* =========================================================
   10. FİZİK
   ========================================================= */
function solidAt(r,c){
  const v=grid[r][c]; if(!v) return false;
  if(isGate(v) && colGate(v)===ballColor) return false;
  return true;
}
function overlapping(cx,cy){
  const out=[];
  const c0=Math.floor((cx-R)/cell), c1=Math.floor((cx+R)/cell);
  const r0=Math.floor((cy-R)/cell), r1=Math.floor((cy+R)/cell);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;
    if(!solidAt(r,c)) continue;
    const q=cellRect(r,c);
    const nx=Math.max(q.x,Math.min(cx,q.x+q.w)), ny=Math.max(q.y,Math.min(cy,q.y+q.h));
    const ex=cx-nx, ey=cy-ny;
    if(ex*ex+ey*ey < R*R) out.push({r,c});
  }
  return out;
}
function ballTouches(r,c){
  const q=cellRect(r,c);
  const nx=Math.max(q.x,Math.min(ball.x,q.x+q.w)), ny=Math.max(q.y,Math.min(ball.y,q.y+q.h));
  const ex=ball.x-nx, ey=ball.y-ny;
  return ex*ex+ey*ey < R*R*1.3;
}
function magnetForce(){
  let fx=0, fy=0;
  const cr=Math.floor(ball.y/cell), cc=Math.floor(ball.x/cell), rad=Math.ceil(MAG_RANGE);
  for(let r=cr-rad;r<=cr+rad;r++) for(let c=cc-rad;c<=cc+rad;c++){
    if(r<0||r>=ROWS||c<0||c>=COLS) continue;
    if(grid[r][c]!==9) continue;
    const mx=(c+.5)*cell, my=(r+.5)*cell;
    const ax=mx-ball.x, ay=my-ball.y, d=Math.hypot(ax,ay), maxD=MAG_RANGE*cell;
    if(d>maxD||d<0.5) continue;
    const k=1-d/maxD;
    fx+=(ax/d)*k*MAG_STR_B*U; fy+=(ay/d)*k*MAG_STR_B*U;
  }
  return {fx,fy};
}
function buildMovers(){
  movers=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
    if(grid[r][c]===5) movers.push({r,c,dir:1,t:Math.random()*MOVE_TICK,vis:0});
}
function updateMovers(dt){
  for(const m of movers){
    m.vis += (0-m.vis)*Math.min(1,0.22*dt);
    m.t += dt; if(m.t<MOVE_TICK) continue; m.t=0;
    const nc=m.c+m.dir;
    if(nc<0||nc>=COLS||grid[m.r][nc]!==0||ballTouches(m.r,nc)){ m.dir*=-1; continue; }
    grid[m.r][m.c]=0; grid[m.r][nc]=5; m.c=nc; m.vis=-m.dir*cell;
  }
}
function tryPush(r,c,dr,dc){
  const tr=r+dr, tc=c+dc;
  if(tr<0||tr>=ROWS||tc<0||tc>=COLS) return false;
  if(grid[tr][tc]!==0) return false;
  grid[tr][tc]=8; grid[r][c]=0;
  pushAnims.push({r:tr,c:tc,dr,dc,t:0});
  for(let i=0;i<5;i++) burst((c+.5)*cell,(r+.5)*cell,'#7c8698',1,1.4);
  beep(210,.05,'triangle');
  return true;
}
function applyContacts(list){
  if(!list.length) return;
  for(const h of list) if(grid[h.r][h.c]===6){ deathCell={r:h.r,c:h.c}; hitTrap(); return; }
  let broke=false, changed=false;
  const seen=new Set();
  for(const h of list){
    const k=h.r+':'+h.c; if(seen.has(k)) continue; seen.add(k);
    const v=grid[h.r][h.c];
    if(isChanger(v)){ if(ballColor!==colChg(v)){ setBallColor(colChg(v)); changed=true; } }
    else if(v===8){ tryPush(h.r,h.c,h.dr||0,h.dc||0); }
    else if(isCrack(v) && colBlock(v)===ballColor){
      const q=cellRect(h.r,h.c);
      burst(q.x+cell/2,q.y+cell/2,COLORS[colBlock(v)].dark,6,1.9);
      grid[h.r][h.c]=v-20; beep(330,.05,'square'); buzz(8);
    } else if(isBlock(v) && colBlock(v)===ballColor){
      const q=cellRect(h.r,h.c);
      burst(q.x+cell/2,q.y+cell/2,COLORS[colBlock(v)].base,10,2.7);
      grid[h.r][h.c]=0; broke=true; levelScore+=blockValue();
    }
  }
  if(changed) beep(880,.08,'sine');
  if(broke){ beep(520,.06,'square'); buzz(12); }
  updateHud();
  if(broke && remaining()===0) winLevel();
}
function physicsStep(dt){
  const contacts=[]; let hitX=false, hitY=false;
  const mg=magnetForce();
  const vx=dx+mg.fx;
  if(vx!==0){
    const px=ball.x, sgn=Math.sign(vx);
    ball.x+=vx*dt;
    if(ball.x-R<0){ ball.x=R; hitX=true; }
    if(ball.x+R>boardW){ ball.x=boardW-R; hitX=true; }
    const h=overlapping(ball.x,ball.y);
    if(h.length){ ball.x=px; hitX=true; h.forEach(o=>{o.dr=0;o.dc=sgn;}); contacts.push(...h); }
  }
  const vy=dy+mg.fy, py=ball.y, sgnY=Math.sign(vy);
  ball.y+=vy*dt;
  if(ball.y-R<0){ ball.y=R; dy=Math.abs(dy); }
  if(ball.y+R>worldH){ ball.y=worldH-R; dy=-Math.abs(dy); }
  const hy=overlapping(ball.x,ball.y);
  if(hy.length){ ball.y=py; hitY=true; hy.forEach(o=>{o.dr=sgnY;o.dc=0;}); contacts.push(...hy); }
  if(hitY) dy=-dy;
  if(hitX) dx=0;
  applyContacts(contacts);
}
function updateCamera(dt){
  if(worldH<=boardH){ scrollY=0; return; }
  const target=Math.max(0,Math.min(worldH-boardH, ball.y-boardH/2));
  scrollY += (target-scrollY)*Math.min(1,0.14*dt);
}
function update(dt){
  tGlobal+=dt;
  updateParts(dt);
  if(colorT<1) colorT=Math.min(1, colorT+dt*0.09);   // ~11 kare yumuşak geçiş
  if(shake>0) shake=Math.max(0,shake-0.035*dt);
  if(toast){ toast.life-=0.016*dt; if(toast.life<=0) toast=null; }
  if(state==='dying'){ deathT+=dt; if(deathT>=45) afterDeath(); return; }
  if(state!=='playing') return;
  levelTime += dt/60;
  updateMovers(dt); updatePushAnims(dt);
  const stA=strA(), stM=strM();
  const L  = settings.lefty==='on' ? steer.right : steer.left;
  const Rt = settings.lefty==='on' ? steer.left  : steer.right;
  if(L && !Rt)      dx=Math.max(-stM, dx-stA*dt);
  else if(Rt && !L) dx=Math.min( stM, dx+stA*dt);
  else dx=0;
  const sp=Math.max(Math.abs(dx)+MAG_STR_B*U,Math.abs(dy)+MAG_STR_B*U)*dt;
  const n=Math.max(1,Math.ceil(sp/(cell*0.25)));
  for(let i=0;i<n && state==='playing';i++) physicsStep(dt/n);
  updateCamera(dt);
}
let lastT=0;
function loop(t){
  if(!lastT) lastT=t||0;
  let dt=((t||0)-lastT)/16.667; lastT=t||0;
  if(!isFinite(dt)||dt<=0) dt=1;
  update(Math.min(dt,3));
  draw();
  requestAnimationFrame(loop);
}

function remaining(){
  let n=0; for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){ const v=grid[r][c]; if(isBlock(v)||isCrack(v)) n++; }
  return n;
}
function safeCol(){
  const mid=Math.floor(COLS/2), ord=[];
  for(let d=0;d<COLS;d++){ if(mid-d>=0)ord.push(mid-d); if(d>0&&mid+d<COLS)ord.push(mid+d); }
  for(const c of ord) if(!grid[ROWS-1][c]&&!grid[ROWS-2][c]&&!grid[ROWS-3][c]) return c;
  for(let r=ROWS-3;r<ROWS;r++) grid[r][mid]=0;
  return mid;
}
function placeBall(){
  const c=safeCol();
  ball={x:(c+.5)*cell, y:worldH-R*1.6};
  dx=0; dy=-spd();
  steer={left:false,right:false};
  scrollY=Math.max(0,Math.min(worldH-boardH, ball.y-boardH/2));
}
/* Kaynak bölüm 9 sütun; ekranda PAD kadar boş sütun eklenir (parmak alanı, oynanabilir alanın parçası) */
function gridFromRows(rows){
  return rows.map(s=>{
    const arr=new Array(COLS).fill(0);
    for(let i=0;i<s.length;i++) arr[PAD+i] = CHAR[s[i]]!==undefined?CHAR[s[i]]:0;
    return arr;
  });
}
function buildLevelObj(L){
  grid=gridFromRows(L.rows);

  ballColor=L.start; prevColor=L.start; colorT=1;

  [660,830,990].forEach((f,i)=>setTimeout(()=>beep(f,.12,'sine'),i*90));

  if(levelIdx<0){                      // özel bölüm (editörden test veya "Benim Bölümlerim"den oynama)

/* =========================================================
   12. BÖLÜM DOĞRULAYICI (editör + koddan içe aktarma için ortak)
   Kurallar: her renk kırılabilir · tuzağın üstü/altı kapalı, yanları açık ·
             mıknatıs tuzağa ≥3 hücre · hareketli engelin yeri var ·
             kapı arkasında değiştirici yok · güvenli spawn sütunu var
   ========================================================= */
function validateLevel(rows, start){
  const errs=[];
  const g=rows.map(s=>{ const a=new Array(SRC_COLS).fill(0);
    for(let i=0;i<s.length && i<SRC_COLS;i++) a[i]=CHAR[s[i]]!==undefined?CHAR[s[i]]:0; return a; });
  const R2=g.length, C2=SRC_COLS;
  const inb=(r,c)=>r>=0&&r<R2&&c>=0&&c<C2;
  const solidStatic=v=>v!==0 && !isGate(v);

  let hasColor=false;
  for(let r=0;r<R2;r++)for(let c=0;c<C2;c++) if(isBlock(g[r][c])||isCrack(g[r][c])) hasColor=true;
  if(!hasColor) errs.push(t('e_noblock'));

  const mid=Math.floor(C2/2), ord=[];
  for(let d=0;d<C2;d++){ if(mid-d>=0)ord.push(mid-d); if(d>0&&mid+d<C2)ord.push(mid+d); }
  let spawn=-1;
  for(const c of ord) if(!g[R2-1][c]&&!g[R2-2]?.[c]&&!g[R2-3]?.[c]){ spawn=c; break; }
  if(spawn<0) errs.push(t('e_nospawn'));

  let trapV=false, trapH=false;
  for(let r=0;r<R2;r++)for(let c=0;c<C2;c++){
    if(g[r][c]!==6) continue;
    const up=!inb(r-1,c)||solidStatic(g[r-1][c]), down=!inb(r+1,c)||solidStatic(g[r+1][c]);
    const lf=inb(r,c-1)&&g[r][c-1]===0, rt=inb(r,c+1)&&g[r][c+1]===0;
    if(!up||!down) trapV=true;
    if(!lf||!rt) trapH=true;
  }
  if(trapV) errs.push(t('e_trapv'));
  if(trapH) errs.push(t('e_traph'));

  let magBad=false;
  for(let r=0;r<R2;r++)for(let c=0;c<C2;c++){ if(g[r][c]!==9) continue;
    for(let r2=0;r2<R2;r2++)for(let c2=0;c2<C2;c2++){ if(g[r2][c2]!==6) continue;
      if(Math.max(Math.abs(r-r2),Math.abs(c-c2))<3) magBad=true; } }
  if(magBad) errs.push(t('e_magnet'));

  let moverBad=false;
  for(let r=0;r<R2;r++)for(let c=0;c<C2;c++){ if(g[r][c]!==5) continue;
    const room=(inb(r,c-1)&&g[r][c-1]===0)||(inb(r,c+1)&&g[r][c+1]===0);
    if(!room) moverBad=true; }
  if(moverBad) errs.push(t('e_mover'));

  // renk-durumlu erişim analizi
  if(hasColor && spawn>=0){
    const broken=new Set();
    const seeds=[[start,R2-1,spawn]]; const seen=new Set([start+':'+(R2-1)+':'+spawn]);
    const colorsSeen=new Set([start]);
    let changed=true;
    while(changed){ changed=false;
      for(const [col,sr,sc] of seeds.slice()){
        const pass=(r,c)=>{ const v=g[r][c];
          if(v===0) return true; if(broken.has(r+','+c)) return true;
          if(isGate(v)&&colGate(v)===col) return true; return false; };
        if(!pass(sr,sc)) continue;
        const vis=Array.from({length:R2},()=>Array(C2).fill(false));
        const q=[[sr,sc]]; vis[sr][sc]=true;
        while(q.length){ const [r,c]=q.pop();
          for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nr=r+dr,nc=c+dc;
            if(!inb(nr,nc)||vis[nr][nc]) continue;
            if(!pass(nr,nc)) continue;
            vis[nr][nc]=true; q.push([nr,nc]);
          } }
        for(let r=0;r<R2;r++)for(let c=0;c<C2;c++){
          if(!vis[r][c]) continue;
          for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nr=r+dr,nc=c+dc; if(!inb(nr,nc)) continue;
            const v=g[nr][nc];
            if(isChanger(v)){ const c2=colChg(v), key=c2+':'+r+':'+c;
              if(!seen.has(key)){ seen.add(key); seeds.push([c2,r,c]); colorsSeen.add(c2); changed=true; } }
            else if((isBlock(v)||isCrack(v)) && colBlock(v)===col){
              const key=nr+','+nc; if(!broken.has(key)){ broken.add(key); changed=true; } }
          } } } }
    let unbroken=0, missingColors=new Set();
    for(let r=0;r<R2;r++)for(let c=0;c<C2;c++){ const v=g[r][c];
      if((isBlock(v)||isCrack(v)) && !broken.has(r+','+c)){
        unbroken++; if(!colorsSeen.has(colBlock(v))) missingColors.add(colBlock(v)); } }
    if(missingColors.size) errs.push(t('e_color')+[...missingColors].join(', '));
    else if(unbroken) errs.push(t('e_unreach'));
  }
  return errs;
}

/* --- Bölümü JSON dosyası olarak indir --- */
function levelToJSON(L){
  return JSON.stringify({format:'hueball-level-v1', name:L.name||'', start:L.start, rows:L.rows}, null, 1);
}
function safeName(n){
  return (n||'hueball-level').replace(/[^0-9A-Za-zÇĞİÖŞÜçğıöşü _-]+/g,'').trim().replace(/\s+/g,'-') || 'hueball-level';
}
function downloadLevel(L){
  try{
    const blob=new Blob([levelToJSON(L)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=safeName(L.name)+'.hueball.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(_){} }, 600);
    return true;
  }catch(_){ return false; }
}
/* Dosyadan gelen bölümü normalize et */
function levelFromObj(o){
  if(!o || typeof o!=='object') throw new Error('bad');
  const rows = o.rows || o.r;
  const start = o.start || o.s;
  if(!Array.isArray(rows) || !rows.length || typeof start!=='string') throw new Error('bad');
  if(!CK.indexOf) throw new Error('bad');
  if(CK.indexOf(start)<0) throw new Error('bad');
  const clean = rows.map(x=>String(x).slice(0,SRC_COLS).padEnd(SRC_COLS,'.'));
  return {name:(o.name||o.n||t('custom_word')), start, rows:clean};
}

    case 8:  return S('<rect x="2.5" y="2.5" width="19" height="19" rx="3" fill="#96a0af" stroke="#343a45" stroke-width="1.8"/><path d="M12 6.5 V17.5 M6.5 12 H17.5 M12 6.5 l-2 2.3 M12 6.5 l2 2.3 M12 17.5 l-2 -2.3 M12 17.5 l2 -2.3 M6.5 12 l2.3 -2 M6.5 12 l2.3 2 M17.5 12 l-2.3 -2 M17.5 12 l-2.3 2" stroke="#2f3540" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>');
    case 5:  return S('<rect x="2.5" y="2.5" width="19" height="19" rx="3" fill="#69717f" stroke="#262b34" stroke-width="1.8"/><path d="M6 12 H18 M6 12 l2.6 -2.4 M6 12 l2.6 2.4 M18 12 l-2.6 -2.4 M18 12 l-2.6 2.4" stroke="#e8e9ed" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>');
    case 9:  return S('<circle cx="12" cy="12" r="10.5" fill="none" stroke="#b06cff" stroke-width="1" opacity=".45"/><rect x="5" y="5" width="14" height="14" rx="3.5" fill="#2b2338" stroke="#b06cff" stroke-width="2.2"/><path d="M8.6 14.5 a3.4 3.4 0 0 1 6.8 0" stroke="#d5b3ff" stroke-width="2.6" fill="none"/><path d="M8.6 14.5 v2.2 M15.4 14.5 v2.2" stroke="#d5b3ff" stroke-width="2.6"/>');
  }
  return S('');
}
function edRenderPalette(){
  const box=document.getElementById('edTypes'); box.innerHTML='';
  edTypeList.forEach(o=>{
    const b=document.createElement('button');

    b.onclick=()=>{ edSelType=o.v; edRenderPalette(); };
    box.appendChild(b);
  });
  const cbox=document.getElementById('edColors'); cbox.innerHTML='';
  CK.forEach(k=>{
    const b=document.createElement('button');
    b.style.background=COLORS[k].base; b.className = k===edSelColor?'on':'';
    b.onclick=()=>{ edSelColor=k; edRenderPalette(); };
    cbox.appendChild(b);
  });
  const sbox=document.getElementById('edStart'); sbox.innerHTML='';
  CK.forEach(k=>{
    const b=document.createElement('button');

    b.onclick=()=>{ edStart=k; edRenderPalette(); };

}
function edRefreshLabels(){
  document.querySelectorAll('#edTypes button').forEach((b,i)=>{ if(edTypeList[i]) b.textContent=t(edTypeList[i].k); });
  const btest=document.getElementById('edTest'); if(btest) btest.textContent=t('ed_test');
}
function edCellValue(type,color){
  if(type===0||type===7||type===6||type===8||type===5||type===9) return type;
  if(type===1) return 1+CK.indexOf(color);
  if(type===21) return 21+CK.indexOf(color);
  if(type===11) return 11+CK.indexOf(color);
  if(type===31) return 31+CK.indexOf(color);
  return 0;
}
const ED_COLS = 16, ED_VIEW_ROWS = 9;
let edScroll = 0;   // görünür pencerenin üst satırı (kesirli olabilir, akıcı kaydırma için)

function edMaxScroll(){ return Math.max(0, edRows - ED_VIEW_ROWS); }
function edClampScroll(){ edScroll = Math.max(0, Math.min(edMaxScroll(), edScroll)); }
function edScrollBy(n){ edScroll += n; edClampScroll(); edRender(); }

function edRender(){
  edClampScroll();
  const cw = edCanvas.width/ED_COLS, ch = edCanvas.height/ED_VIEW_ROWS;   // hücre boyutu SABİT
  edCtx.clearRect(0,0,edCanvas.width,edCanvas.height);
  edCtx.fillStyle='#0c0d11'; edCtx.fillRect(0,0,edCanvas.width,edCanvas.height);
  const top = Math.floor(edScroll);
  for(let vr=0; vr<ED_VIEW_ROWS+1; vr++){
    const r = top+vr; if(r>=edRows) break;
    const y = (vr - (edScroll-top))*ch;
    for(let c=0;c<ED_COLS;c++){
      const v=edGrid[r][c], x=c*cw;
      edCtx.strokeStyle='rgba(255,255,255,.06)'; edCtx.lineWidth=1;
      edCtx.strokeRect(x+.5,y+.5,cw-1,ch-1);
      if(!v) continue;
      let col='#8b93a1', label='';
      if(isBlock(v)){ col=COLORS[colBlock(v)].base; }
      else if(isCrack(v)){ col=COLORS[colBlock(v)].dark; label='½'; }
      else if(isChanger(v)){ col='#20232b'; edCtx.strokeStyle=COLORS[colChg(v)].base; edCtx.lineWidth=2;
        edCtx.strokeRect(x+2,y+2,cw-4,ch-4); label='◐'; }
      else if(isGate(v)){ col='rgba(0,0,0,0)'; edCtx.strokeStyle=COLORS[colGate(v)].base; edCtx.setLineDash([3,2]);
        edCtx.lineWidth=2; edCtx.strokeRect(x+2,y+2,cw-4,ch-4); edCtx.setLineDash([]); }
      else if(v===7) col='#5b6472';
      else if(v===6){ col='#c0392b'; label='×'; }
      else if(v===8){ col='#7d8798'; label='□'; }
      else if(v===5){ col='#6b7280'; label='↔'; }
      else if(v===9){ col='#b06cff'; label='◎'; }
      if(col && col!=='rgba(0,0,0,0)'){ edCtx.fillStyle=col; edCtx.fillRect(x+2,y+2,cw-4,ch-4); }
      if(label){ edCtx.fillStyle='rgba(255,255,255,.9)'; edCtx.font=(Math.min(cw,ch)*0.5)+'px sans-serif';
        edCtx.textAlign='center'; edCtx.textBaseline='middle'; edCtx.fillText(label,x+cw/2,y+ch/2); }
    }
  }
  // spawn ipucu (alt 3 satır) — görünür pencereyle kesişiyorsa çiz
  const spawnTop = edRows-3, spawnBottom = edRows;
  const visTop = Math.max(spawnTop, top), visBottom = Math.min(spawnBottom, top+ED_VIEW_ROWS+1);
  if(visBottom>visTop){
    const y0=(visTop-edScroll)*ch, y1=(visBottom-edScroll)*ch;
    edCtx.strokeStyle='rgba(108,140,255,.5)'; edCtx.lineWidth=2;
    edCtx.strokeRect(1,y0+1, ED_COLS*cw-2, (y1-y0)-2);
  }
  // kaydırma çubuğu
  if(edRows>ED_VIEW_ROWS){
    const bx=edCanvas.width-4;
    edCtx.fillStyle='rgba(255,255,255,.08)'; edCtx.fillRect(bx,0,3,edCanvas.height);
    const th=Math.max(14, edCanvas.height*(ED_VIEW_ROWS/edRows));
    const ty=(edCanvas.height-th)*(edScroll/edMaxScroll());
    edCtx.fillStyle='rgba(108,140,255,.6)'; edCtx.fillRect(bx,ty,3,th);
  }
  document.getElementById('edUp').disabled = edScroll<=0;
  document.getElementById('edDown').disabled = edScroll>=edMaxScroll();
  const lbl=document.getElementById('edRowLabel');
  if(lbl) lbl.textContent = edRows>ED_VIEW_ROWS ? (top+1)+'–'+Math.min(edRows,top+ED_VIEW_ROWS)+' / '+edRows : '';
}
function edPointToCell(clientX,clientY){
  const rect=edCanvas.getBoundingClientRect();
  const x=(clientX-rect.left)*(edCanvas.width/rect.width);
  const y=(clientY-rect.top)*(edCanvas.height/rect.height);
  const cw=edCanvas.width/ED_COLS, ch=edCanvas.height/ED_VIEW_ROWS;
  const c=Math.floor(x/cw), r=Math.floor(edScroll)+Math.floor(y/ch);
  if(r<0||r>=edRows||c<0||c>=ED_COLS) return null;
  return {r,c};
}
function edPaintAt(clientX,clientY){
  const p=edPointToCell(clientX,clientY); if(!p) return;
  edGrid[p.r][p.c]=edCellValue(edSelType,edSelColor);
  edRender();
}

/* --- Geri alma yığını --- */
function edSnapshot(){
  edUndoStack.push(edGrid.map(r=>r.slice()));
  if(edUndoStack.length>50) edUndoStack.shift();
}
function edUndoLast(){
  if(!edUndoStack.length){ edShowMsg(t('ed_nothing'),''); return; }
  edGrid=edUndoStack.pop();
  if(edGrid.length!==edRows){ edRows=edGrid.length; edSyncRowsSeg(); }
  edClampScroll(); edRender(); edShowMsg('','');
}

/* --- Dokunuş: SADECE dokunup bırakınca yerleştirir. --- 
   Parmak kayarsa hiçbir şey eklenmez, yalnızca ızgara kaydırılır.
   Böylece yukarı-aşağı gezinirken yanlışlıkla nesne bırakılmaz. */
let edGesture=null;
const ED_MOVE_TOL = 8;      // piksel — bunun üstü "kaydırma" sayılır
edCanvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{ edCanvas.setPointerCapture(e.pointerId); }catch(_){}
  edGesture={x0:e.clientX, y0:e.clientY, scroll0:edScroll, moved:false};
});
edCanvas.addEventListener('pointermove',e=>{
  if(!edGesture) return;
  const dx=e.clientX-edGesture.x0, dy=e.clientY-edGesture.y0;
  if(!edGesture.moved && Math.hypot(dx,dy)>ED_MOVE_TOL) edGesture.moved=true;
  if(edGesture.moved){
    const rect=edCanvas.getBoundingClientRect();
    const scale=rect.height ? (edCanvas.height/rect.height) : 1;
    const ch=edCanvas.height/ED_VIEW_ROWS;
    edScroll = edGesture.scroll0 - (dy*scale)/ch;
    edClampScroll(); edRender();
  }
});
function edEndGesture(e){
  try{ if(e&&e.pointerId!=null) edCanvas.releasePointerCapture(e.pointerId); }catch(_){}
  if(edGesture && !edGesture.moved){        // kaydırılmadıysa = kasıtlı dokunuş
    edSnapshot();
    edPaintAt(edGesture.x0, edGesture.y0);
  }
  edGesture=null;
}
edCanvas.addEventListener('pointerup',edEndGesture);
edCanvas.addEventListener('pointercancel',()=>{ edGesture=null; });
edCanvas.addEventListener('wheel',e=>{ e.preventDefault(); edScrollBy(e.deltaY>0?0.6:-0.6); },{passive:false});
document.getElementById('edUp').onclick  =()=>edScrollBy(-1);
document.getElementById('edDown').onclick=()=>edScrollBy(1);
document.getElementById('edUndo').onclick=edUndoLast;

function edShowMsg(text,cls){
  const el=document.getElementById('edMsg');
  if(!text){ el.className=''; el.textContent=''; return; }
  el.textContent=text;
  el.className='show '+(cls||'');
}
document.getElementById('edMsg').onclick=()=>{ edShowMsg('',''); };
/* Doğrulama tamamen İSTEĞE BAĞLIDIR — hiçbir şeyi engellemez.
   Oyuncu çıkmaz sokak, çözülemez ya da zorlu bir bölüm kurmakta serbesttir. */
function edValidateNow(){
  const errs=validateLevel(edToRows(), edStart);
  if(errs.length){
    edShowMsg(t('ed_warn_head')+'\n• '+errs.join('\n• '),'warn');
    return false;
  }
  edShowMsg(t('ed_ok'),'ok'); return true;
}
document.getElementById('edCheck').onclick=edValidateNow;
document.getElementById('edTest').onclick=()=>{
  const L={name:t('custom_word'), start:edStart, rows:edToRows()};
  loadCustomLevel(L, true);   // hiçbir koşul yok — her tasarım denenebilir
};
document.getElementById('edSave').onclick=()=>{
  const def=(edEditingIndex!=null && progress.custom[edEditingIndex]) ?
    progress.custom[edEditingIndex].name : (t('custom_word')+' '+(progress.custom.length+1));
  let name=def;
  try{ const p=window.prompt ? window.prompt(t('ed_type')+'?',def) : def; if(p) name=p; }catch(_){}
  const L={name, start:edStart, rows:edToRows()};
  if(edEditingIndex!=null) progress.custom[edEditingIndex]=L; else progress.custom.push(L);
  saveAll(); edShowMsg(t('ed_saved'),'ok');
};
document.getElementById('edClear').onclick=()=>{
  edSnapshot();
  edGrid=Array.from({length:edRows},()=>Array(ED_COLS).fill(0)); edRender();
};
function edExit(){ levelsTab='mine'; showScreen('levels'); setLevelsTab('mine'); }
document.getElementById('edBack').onclick  = edExit;
document.getElementById('edBack2').onclick = edExit;
document.getElementById('btnNewLevel').onclick=()=>{ edEditingIndex=null; edNewLevel(); showScreen('editor'); };

document.getElementById('btnUpload').onclick=()=>{
  const fi=document.getElementById('fileInput');
  try{ fi.value=''; }catch(_){}
  fi.click();
};
document.getElementById('fileInput').onchange=function(e){
  const f = e && e.target && e.target.files && e.target.files[0];
  if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const L=levelFromObj(JSON.parse(String(fr.result)));
      progress.custom.push(L); saveAll(); paintCustom();
      alert(t('ed_imported'));
    }catch(_){ alert(t('ed_badfile')); }
    try{ e.target.value=''; }catch(_){}
  };
  fr.onerror=()=>alert(t('ed_badfile'));
  fr.readAsText(f);
};

/* --- ayar segmentleri --- */
(function bindSegs(){
  const segs=document.querySelectorAll('.seg[data-set]');
  for(let i=0;i<segs.length;i++){
    const seg=segs[i], key=seg.getAttribute('data-set');
    seg.querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{
        settings[key]=b.getAttribute('data-v');
        if(key==='lang'){ lang=settings.lang; applyI18n(); }
        if(key==='zoom'){ layout(); }
        paintSettings(); saveAll();
      };
    });
  }
  const rseg=document.querySelector('[data-edset="rows"]');
  if(rseg) rseg.querySelectorAll('button').forEach(b=>{

  });
})();

  if(state!=='playing' && state!=='pause') return;
  levelIdx>=0 ? loadLevel(levelIdx) : loadCustomLevel(curLevel,testingFromEditor);
};

const halfL=document.getElementById('halfL'), halfR=document.getElementById('halfR');
function hold(el,on,off){
  el.addEventListener('pointerdown',e=>{ e.preventDefault();
    try{el.setPointerCapture(e.pointerId);}catch(_){} on(); el.classList.add('active'); });
  const rel=e=>{ try{ if(e&&e.pointerId!=null) el.releasePointerCapture(e.pointerId);}catch(_){}
    off(); el.classList.remove('active'); };
  el.addEventListener('pointerup',rel); el.addEventListener('pointercancel',rel);
  window.addEventListener('blur',()=>rel());
}
hold(halfL,()=>{if(steer)steer.left=true;},()=>{if(steer)steer.left=false;});
hold(halfR,()=>{if(steer)steer.right=true;},()=>{if(steer)steer.right=false;});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key===' ') e.preventDefault();
  if(e.key==='Escape'||e.key===' '){
    if(document.getElementById('panelEditor').classList.contains('show')){ edExit(); return; }
    if(document.getElementById('panelLevels').classList.contains('show') ||
       document.getElementById('panelSettings').classList.contains('show')){ showScreen('menu'); return; }
    pauseGame(); return;
  }
  if(!steer) return;
  if(e.key==='ArrowLeft'){ steer.left=true; halfL.classList.add('active'); }
  if(e.key==='ArrowRight'){ steer.right=true; halfR.classList.add('active'); }
});
window.addEventListener('keyup',e=>{
  if(!steer) return;
  if(e.key==='ArrowLeft'){ steer.left=false; halfL.classList.remove('active'); }
  if(e.key==='ArrowRight'){ steer.right=false; halfR.classList.remove('active'); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', ()=>setTimeout(layout,150));

/* ---- başlangıç ---- */
loadSave();
layout();
applyI18n();
edRenderPalette();
levelIdx=0;
buildLevel(0);
showScreen('menu');
loop();
})();
